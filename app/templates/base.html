<!doctype html>
<html lang="ru" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proxy_rail — {% block title %}Админка{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  body { background: #0f1420; }
  .card { border: 1px solid #1e2740; background: #131a2b; }
  code { color: #7dd3fc; }
  .table { --bs-table-bg: transparent; }
  .navbar { background: #0c1018; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg border-bottom">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-hdd-network text-primary"></i> proxy_rail</a>
    {% if is_admin %}
    <div class="navbar-nav flex-row gap-3">
      <a class="nav-link" href="/">Дашборд</a>
      <a class="nav-link" href="/nodes">Ноды</a>
      <a class="nav-link" href="/creds">Прокси</a>
    </div>
    <a class="btn btn-sm btn-outline-secondary ms-auto" href="/logout"><i class="bi bi-box-arrow-right"></i> Выйти</a>
    {% endif %}
  </div>
</nav>
<div class="container py-4">
  {% if msg %}<div class="alert alert-success py-2">{{ msg }}</div>{% endif %}
  {% if err %}<div class="alert alert-danger py-2">{{ err }}</div>{% endif %}
  {% block content %}{% endblock %}
</div>
<script>
document.querySelectorAll('[data-copy]').forEach(function (b) {
  b.addEventListener('click', function () {
    navigator.clipboard.writeText(b.getAttribute('data-copy')).then(function () {
      var old = b.innerHTML;
      b.innerHTML = '<i class="bi bi-check2"></i>';
      setTimeout(function () { b.innerHTML = old; }, 1200);
    });
  });
});
</script>
</body>
</html>
